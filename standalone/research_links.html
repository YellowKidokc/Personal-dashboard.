<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POF 2828 — Research Links</title>
<style>
:root{--bg:#0B0C0F;--surface:#11131A;--surface2:#181B26;--border:rgba(244,246,255,.08);--text:#F4F6FF;--muted:#8A8F9E;--gold:#F2C94C;--blue:#4F8EF7;--green:#4ECB71;--purple:#9B7FE8;--cyan:#06b6d4;--gray:#8A8F9E;--red:#E05C6E}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column}
.header{padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;justify-content:space-between;align-items:center}.brand{font:700 11px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:var(--gold)}
.btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:11px}
.layout{display:grid;grid-template-columns:380px 1fr;min-height:0;flex:1}.left{border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.search{margin:10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px;color:var(--text)}
.tabs{display:flex;gap:4px;padding:0 10px 10px;overflow:auto}.tab{white-space:nowrap;border:1px solid var(--border);background:var(--surface2);color:var(--muted);padding:5px 9px;border-radius:999px;font-size:10px;cursor:pointer}.tab.active{color:var(--gold)}
.list{overflow:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:8px}.card{border:1px solid var(--border);border-left:3px solid var(--gray);background:var(--surface2);border-radius:8px;padding:10px;cursor:pointer}.card.active{border-right-color:var(--gold)}
.title{font-weight:700}.url{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{display:inline-block;margin:4px 4px 0 0;font-size:9px;padding:2px 6px;border:1px solid var(--border);border-radius:999px;color:var(--muted)}
.right{padding:14px;overflow:auto}.box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center}.modal.open{display:flex}.panel{width:min(560px,95vw);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px}
label{font-size:10px;color:var(--muted);text-transform:uppercase;display:block;margin-top:8px}.inp,textarea,select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px;font:inherit}textarea{min-height:100px}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
  <div class="brand">POF 2828 · RESEARCH LINKS</div>
  <div>
    <button class="btn" onclick="openCreate()">+ New</button>
    <button class="btn" onclick="exportJSON()">Export</button>
    <button class="btn" onclick="importJSON()">Import</button>
  </div>
</div>
<div class="layout">
  <section class="left">
    <input id="search" class="search" placeholder="Search title, URL, tags, notes">
    <div id="tabs" class="tabs"></div>
    <div id="list" class="list"></div>
  </section>
  <section class="right" id="detail"></section>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="panel">
    <h3 id="modalTitle" style="margin:0;color:var(--gold)">New Bookmark</h3>
    <input type="hidden" id="editId">
    <label>Title</label><input id="fTitle" class="inp">
    <label>URL</label><input id="fUrl" class="inp" type="url">
    <label>Category</label>
    <select id="fCategory" class="inp"><option>Theophysics</option><option>Infrastructure</option><option>Research</option><option>Consciousness</option><option>Physics</option><option>General</option></select>
    <label>Tags (comma separated)</label><input id="fTags" class="inp">
    <label>Notes</label><textarea id="fNotes"></textarea>
    <div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveBookmark()">Save</button></div>
  </div>
</div>

<script>
const STORE='pof2828_bookmarks';
const GATEWAY=localStorage.getItem('pof2828_gateway_url')||null;
const CATS=['All','Theophysics','Infrastructure','Research','Consciousness','Physics','General'];
const CAT_COLOR={Theophysics:'var(--gold)',Infrastructure:'var(--blue)',Research:'var(--green)',Consciousness:'var(--purple)',Physics:'var(--cyan)',General:'var(--gray)'};
let rows=JSON.parse(localStorage.getItem(STORE)||'[]');
let active='All'; let selected=rows[0]?.id||null;
const esc=s=>{const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;};
function persist(){localStorage.setItem(STORE,JSON.stringify(rows));}
async function sync(method,path,payload){if(!GATEWAY)return;try{await fetch(`${GATEWAY}/api/${path}`,{method,headers:{'Content-Type':'application/json'},body:payload?JSON.stringify(payload):undefined});}catch(_){}}
function filtered(){const q=document.getElementById('search').value.toLowerCase();return rows.filter(r=>(active==='All'||(r.category||'General')===active)&&(`${r.title} ${r.url} ${(r.tags||[]).join(' ')} ${r.notes||''}`).toLowerCase().includes(q));}
function renderTabs(){document.getElementById('tabs').innerHTML=CATS.map(c=>`<button class='tab ${c===active?'active':''}' onclick="active='${c}';render()">${c}</button>`).join('');}
function renderList(){const f=filtered();if(!f.length){document.getElementById('list').innerHTML='<div class="card">No links found.</div>';return;}if(!f.some(x=>x.id===selected))selected=f[0].id;document.getElementById('list').innerHTML=f.map(r=>`<div class='card ${r.id===selected?'active':''}' style='border-left-color:${CAT_COLOR[r.category]||CAT_COLOR.General}' onclick="selected='${r.id}';render()"><div class='title'>${esc(r.title)}</div><div class='url'>${esc(r.url)}</div><div>${(r.tags||[]).map(t=>`<span class='tag'>${esc(t)}</span>`).join('')}</div></div>`).join('');}
function renderDetail(){const r=rows.find(x=>x.id===selected);const d=document.getElementById('detail');if(!r){d.innerHTML='<p style="color:var(--muted)">Select a bookmark.</p>';return;}d.innerHTML=`<h2 style='margin:0'>${esc(r.title)}</h2><div style='color:var(--muted);font-size:11px'>${esc(r.category||'General')}</div><div class='box' style='margin-top:8px'><div style='font-size:11px;color:var(--muted)'>URL</div><div><a href='${esc(r.url)}' target='_blank' rel='noreferrer' style='color:var(--blue)'>${esc(r.url)}</a></div></div><div class='box' style='margin-top:8px'><div style='font-size:11px;color:var(--muted)'>Notes</div><div style='white-space:pre-wrap'>${esc(r.notes||'No notes yet.')}</div></div><div class='actions'><button class='btn' onclick="window.open('${r.url}','_blank')">Open</button><button class='btn' onclick="copyUrl('${r.id}')">Copy URL</button><button class='btn' onclick="openEdit('${r.id}')">Edit</button><button class='btn' style='color:var(--red)' onclick="removeRow('${r.id}')">Delete</button></div>`;}
function render(){renderTabs();renderList();renderDetail();}
async function copyUrl(id){const r=rows.find(x=>x.id===id);if(!r)return;await navigator.clipboard.writeText(r.url).catch(()=>{});}
function openCreate(){document.getElementById('modalTitle').textContent='New Bookmark';document.getElementById('editId').value='';['fTitle','fUrl','fTags','fNotes'].forEach(id=>document.getElementById(id).value='');document.getElementById('fCategory').value='General';document.getElementById('modal').classList.add('open');}
function openEdit(id){const r=rows.find(x=>x.id===id);if(!r)return;document.getElementById('modalTitle').textContent='Edit Bookmark';document.getElementById('editId').value=r.id;document.getElementById('fTitle').value=r.title;document.getElementById('fUrl').value=r.url;document.getElementById('fCategory').value=r.category||'General';document.getElementById('fTags').value=(r.tags||[]).join(', ');document.getElementById('fNotes').value=r.notes||'';document.getElementById('modal').classList.add('open');}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function saveBookmark(){const id=document.getElementById('editId').value||`b_${Math.random().toString(36).slice(2,8)}`;const prev=rows.find(r=>r.id===id)||{};const item={id,title:document.getElementById('fTitle').value.trim(),url:document.getElementById('fUrl').value.trim(),category:document.getElementById('fCategory').value||'General',tags:document.getElementById('fTags').value.split(',').map(t=>t.trim()).filter(Boolean),notes:document.getElementById('fNotes').value.trim(),created_at:prev.created_at||new Date().toISOString()};if(!item.title||!item.url)return;const idx=rows.findIndex(r=>r.id===id);if(idx>=0){rows[idx]=item;sync('PUT',`bookmarks/${id}`,item);}else{rows.unshift(item);sync('POST','bookmarks',item);}selected=id;persist();closeModal();render();}
function removeRow(id){const r=rows.find(x=>x.id===id);if(!r||!confirm(`Delete "${r.title}"?`))return;rows=rows.filter(x=>x.id!==id);persist();sync('DELETE',`bookmarks/${id}`);render();}
function exportJSON(){const b=new Blob([JSON.stringify(rows,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`pof2828_bookmarks_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);}
function importJSON(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d))throw 1;rows=d;selected=rows[0]?.id||null;persist();render();}catch{}};i.click();}
document.getElementById('search').addEventListener('input',render);render();
</script>
</body>
</html>
