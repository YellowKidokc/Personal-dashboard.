<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>POF 2828 — Research Links</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f; --surface: #12121c; --surface2: #1a1a25;
    --border: #1e1e2e; --border-hover: #2a2a3e;
    --text: #c8ccd4; --text-dim: #666680; --text-bright: #e8ecf4;
    --accent: #4a6fa5; --gold: #f59e0b; --green: #10b981;
    --red: #ef4444; --purple: #8b5cf6; --blue: #3b82f6;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 3px; }

  body {
    font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace;
    background: var(--bg); color: var(--text);
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .header {
    padding: 12px 16px 10px; border-bottom: 1px solid var(--border);
    background: #0d0d14; flex-shrink: 0;
  }
  .header-top {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-tag { font-size: 10px; letter-spacing: 3px; color: var(--gold); font-weight: 700; }
  .brand-sep { font-size: 11px; color: #2a2a3a; }
  .brand-sub { font-size: 10px; letter-spacing: 2px; color: #444; }

  .hdr-btn {
    background: transparent; border: 1px solid #2a2a3a; color: #555;
    padding: 4px 10px; border-radius: 4px; font-size: 10px; font-family: inherit;
    cursor: pointer; letter-spacing: 1px; transition: all 0.12s ease;
  }
  .hdr-btn:hover { border-color: var(--accent); color: var(--accent); }

  .status-dot {
    width: 6px; height: 6px; border-radius: 50%; display: inline-block;
    background: var(--green); margin-right: 4px; box-shadow: 0 0 6px var(--green);
  }
  .status-dot.offline { background: var(--red); box-shadow: 0 0 6px var(--red); }

  .search-wrap { position: relative; }
  .search-icon {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: #3a3a4a; pointer-events: none; font-size: 14px;
  }
  .search-input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 9px 12px 9px 32px; color: var(--text);
    font-size: 13px; font-family: inherit; outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: #333; }

  .tabs {
    display: flex; gap: 2px; padding: 8px 16px 0;
    border-bottom: 1px solid var(--border); background: var(--bg);
    overflow-x: auto; flex-shrink: 0;
  }
  .tab {
    padding: 6px 14px 8px; font-size: 10px; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--text-dim); cursor: pointer;
    border-bottom: 2px solid transparent; transition: all 0.12s; white-space: nowrap;
    font-family: inherit; background: none; border-top: none; border-left: none; border-right: none;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); }

  .card-list {
    flex: 1; overflow-y: auto; padding: 12px 16px;
    display: flex; flex-direction: column; gap: 8px;
  }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 12px 14px; cursor: pointer;
    transition: all 0.08s ease; border-left: 3px solid var(--accent);
  }
  .card:hover { background: #14141e; border-color: var(--border-hover); }
  .card:active { transform: scale(0.99); }

  .card-title {
    font-size: 13px; font-weight: 700; color: var(--text-bright);
    margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card-url {
    font-size: 10px; color: var(--text-dim); margin-bottom: 8px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
  .tag-pill {
    font-size: 8px; letter-spacing: 1px; text-transform: uppercase;
    padding: 2px 8px; border-radius: 3px; background: #15151f;
    color: var(--text-dim); border: 1px solid #1e1e2e;
  }

  .card-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .action-btn {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    min-width: 52px; min-height: 44px; padding: 8px 14px;
    border-radius: 5px; border: 1px solid #2a2a3a; background: transparent;
    color: var(--text-dim); font-size: 10px; letter-spacing: 1px;
    text-transform: uppercase; font-family: inherit; cursor: pointer;
    transition: all 0.1s ease; font-weight: 500;
  }
  .action-btn:active { transform: scale(0.95); }
  .action-btn.open { border-color: rgba(59,130,246,0.4); color: var(--blue); flex: 1; }
  .action-btn.open:hover { background: rgba(59,130,246,0.12); }
  .action-btn.copy { border-color: rgba(16,185,129,0.4); color: var(--green); }
  .action-btn.copy:hover { background: rgba(16,185,129,0.12); }
  .action-btn.edit { border-color: rgba(139,92,246,0.4); color: var(--purple); }
  .action-btn.edit:hover { background: rgba(139,92,246,0.12); }
  .action-btn.delete { border-color: rgba(239,68,68,0.3); color: #884444; }
  .action-btn.delete:hover { background: rgba(239,68,68,0.08); color: var(--red); }
  .action-btn .icon { font-size: 16px; }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 100; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px; width: 100%; max-width: 520px;
  }
  .modal h2 { font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: var(--blue); margin-bottom: 16px; }
  .modal label { display: block; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px; margin-top: 12px; }
  .modal input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 5px; padding: 10px 12px; color: var(--text);
    font-size: 13px; font-family: inherit; outline: none;
  }
  .modal input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; }
  .modal-btn {
    padding: 10px 24px; border-radius: 5px; font-size: 11px; font-family: inherit;
    letter-spacing: 1px; cursor: pointer; font-weight: 600; min-height: 44px;
    border: 1px solid var(--border);
  }
  .modal-btn.save { background: var(--blue); color: #fff; border-color: var(--blue); }
  .modal-btn.cancel { background: transparent; color: var(--text-dim); }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--blue); color: #fff; padding: 8px 20px;
    border-radius: 5px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    font-weight: 700; font-family: inherit; z-index: 200;
    transition: transform 0.2s ease; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 480px) {
    .card-actions { gap: 4px; }
    .action-btn { min-height: 48px; font-size: 11px; }
    .action-btn.open { flex: 2; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="brand">
      <span class="brand-tag">POF 2828</span>
      <span class="brand-sep">|</span>
      <span class="brand-sub">RESEARCH LINKS</span>
    </div>
    <div style="display:flex;gap:6px;align-items:center">
      <span class="status-dot" id="statusDot"></span>
      <button class="hdr-btn" onclick="openCreateModal()">+ NEW</button>
    </div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" class="search-input" id="searchInput" placeholder="Search links..." autocomplete="off">
  </div>
</div>

<div class="tabs" id="tabsContainer">
  <button class="tab active" data-category="all">ALL</button>
</div>

<div class="card-list" id="cardList"></div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="modalTitle">New Bookmark</h2>
    <input type="hidden" id="editId">
    <label>Title</label>
    <input type="text" id="fieldTitle" placeholder="e.g. Theophysics Dashboard">
    <label>URL</label>
    <input type="url" id="fieldUrl" placeholder="https://...">
    <label>Category</label>
    <input type="text" id="fieldCategory" placeholder="e.g. Theophysics, Infrastructure">
    <label>Tags (comma separated)</label>
    <input type="text" id="fieldTags" placeholder="e.g. dashboard, api">
    <label>Notes</label>
    <input type="text" id="fieldNotes" placeholder="Optional annotation">
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModal()">CANCEL</button>
      <button class="modal-btn save" onclick="saveBookmark()">SAVE</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORE = 'pof2828_bookmarks';
const GATEWAY = localStorage.getItem('pof2828_gateway_url') || null;
const CATEGORY_COLORS = {
  Theophysics: '#F2C94C', Infrastructure: '#4F8EF7', Research: '#4ECB71',
  Consciousness: '#9B7FE8', Physics: '#06b6d4', General: '#8A8F9E'
};
let bookmarks = JSON.parse(localStorage.getItem(STORE) || '[]');
let activeCategory = 'all';
let searchQuery = '';

function persist(){ localStorage.setItem(STORE, JSON.stringify(bookmarks)); }
function syncStatus(){ document.getElementById('statusDot').classList.toggle('offline', !GATEWAY); }
async function syncToGateway(method,path,payload){ if(!GATEWAY) return; try{ await fetch(`${GATEWAY}/api/${path}`,{method,headers:{'Content-Type':'application/json'},body:payload?JSON.stringify(payload):undefined}); }catch(_){} }

function categories(){ return ['all', ...new Set(bookmarks.map(b => b.category || 'General'))]; }
function buildTabs(){
  const c = document.getElementById('tabsContainer');
  c.innerHTML = categories().map(cat=>`<button class="tab${cat===activeCategory?' active':''}" data-category="${esc(cat)}" onclick="setCategory(${JSON.stringify(cat)})">${esc(cat.toUpperCase())}</button>`).join('');
}
function setCategory(cat){ activeCategory=cat; buildTabs(); render(); }

function render(){
  const list = document.getElementById('cardList');
  let filtered = bookmarks;
  if(activeCategory!=='all'){ filtered = filtered.filter(b=>(b.category||'General').toLowerCase()===activeCategory.toLowerCase()); }
  if(searchQuery){ const q=searchQuery.toLowerCase(); filtered=filtered.filter(b=>[b.title,b.url,b.notes||'',(b.tags||[]).join(' ')].join(' ').toLowerCase().includes(q)); }
  if(!filtered.length){ list.innerHTML='<div class="empty-state"><div class="icon">🔗</div><p>No bookmarks found.</p></div>'; return; }
  list.innerHTML = filtered.map(b=>{
    const color = CATEGORY_COLORS[b.category] || CATEGORY_COLORS.General;
    return `<div class="card" style="border-left-color:${color}" data-id="${b.id}">
      <div class="card-title">${esc(b.title)}</div>
      <div class="card-url">${esc(b.url)}</div>
      <div class="card-preview" style="font-size:10px;color:var(--text-dim);margin-bottom:8px;">${esc((b.notes||'').slice(0,120))}</div>
      <div class="card-tags">${(b.tags||[]).map(t=>`<span class="tag-pill">${esc(t)}</span>`).join('')}</div>
      <div class="card-actions">
        <button class="action-btn open" onclick="event.stopPropagation();window.open('${b.url}','_blank')"><span class="icon">↗</span> OPEN</button>
        <button class="action-btn copy" onclick="event.stopPropagation();copyUrl('${b.id}')"><span class="icon">📋</span></button>
        <button class="action-btn edit" onclick="event.stopPropagation();openEditModal('${b.id}')"><span class="icon">✏️</span></button>
        <button class="action-btn delete" onclick="event.stopPropagation();deleteBookmark('${b.id}')"><span class="icon">🗑️</span></button>
      </div>
    </div>`;
  }).join('');
}

async function copyUrl(id){ const b=bookmarks.find(x=>x.id===id); if(!b)return; await navigator.clipboard.writeText(b.url).catch(()=>{}); showToast('URL COPIED'); }
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
function openCreateModal(){ document.getElementById('modalTitle').textContent='New Bookmark'; ['editId','fieldTitle','fieldUrl','fieldCategory','fieldTags'].forEach(id=>document.getElementById(id).value=''); document.getElementById('fieldNotes').value=''; document.getElementById('modalOverlay').classList.add('open'); }
function openEditModal(id){ const b=bookmarks.find(x=>x.id===id); if(!b)return; document.getElementById('modalTitle').textContent='Edit Bookmark'; document.getElementById('editId').value=b.id; document.getElementById('fieldTitle').value=b.title; document.getElementById('fieldUrl').value=b.url; document.getElementById('fieldCategory').value=b.category||'General'; document.getElementById('fieldTags').value=(b.tags||[]).join(', '); document.getElementById('fieldNotes').value=b.notes||''; document.getElementById('modalOverlay').classList.add('open'); }
function saveBookmark(){
  const editId=document.getElementById('editId').value;
  const data={ id: editId||`b_${Math.random().toString(36).slice(2,8)}`, title:document.getElementById('fieldTitle').value.trim(), url:document.getElementById('fieldUrl').value.trim(), category:document.getElementById('fieldCategory').value.trim()||'General', tags:document.getElementById('fieldTags').value.split(',').map(t=>t.trim()).filter(Boolean), notes:document.getElementById('fieldNotes').value.trim(), created_at:new Date().toISOString() };
  if(!data.title||!data.url) return showToast('TITLE AND URL REQUIRED');
  if(editId){ const idx=bookmarks.findIndex(x=>x.id===editId); if(idx>=0) bookmarks[idx]={...bookmarks[idx],...data}; syncToGateway('PUT',`bookmarks/${editId}`,data);} else { bookmarks.unshift(data); syncToGateway('POST','bookmarks',data);}
  persist(); closeModal(); buildTabs(); render(); showToast(editId?'UPDATED':'CREATED');
}
function deleteBookmark(id){ const b=bookmarks.find(x=>x.id===id); if(!b||!confirm(`Delete "${b.title}"?`)) return; bookmarks=bookmarks.filter(x=>x.id!==id); persist(); syncToGateway('DELETE',`bookmarks/${id}`); buildTabs(); render(); showToast('DELETED'); }
function exportJSON(){ const blob=new Blob([JSON.stringify(bookmarks,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`pof2828_bookmarks_${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(a.href); showToast('EXPORTED'); }
function importJSON(){ const input=document.createElement('input'); input.type='file'; input.accept='.json,application/json'; input.onchange=async(e)=>{ const f=e.target.files?.[0]; if(!f)return; try{ const next=JSON.parse(await f.text()); bookmarks=Array.isArray(next)?next:[]; persist(); buildTabs(); render(); showToast('IMPORTED'); }catch{ showToast('INVALID JSON'); } }; input.click(); }
function esc(s=''){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

document.getElementById('searchInput').addEventListener('input',e=>{ searchQuery=e.target.value; render(); });
document.querySelector('.header-top > div:last-child').insertAdjacentHTML('beforeend','<button class="hdr-btn" onclick="exportJSON()">EXPORT</button><button class="hdr-btn" onclick="importJSON()">IMPORT</button>');
syncStatus(); buildTabs(); render();
</script>
</body>
</html>
