<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POF 2828 — Prompt Picker</title>
<style>
:root{--bg:#0B0C0F;--surface:#11131A;--surface2:#181B26;--border:rgba(244,246,255,.08);--text:#F4F6FF;--muted:#8A8F9E;--gold:#F2C94C;--green:#4ECB71;--blue:#4F8EF7;--purple:#9B7FE8;--red:#E05C6E}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column}
.header{padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font:700 11px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:var(--gold)}.status{font:10px monospace;color:var(--muted)}
.btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:11px}.btn.copy{background:rgba(78,203,113,.16);border-color:rgba(78,203,113,.45);color:var(--green);font-weight:700}
.layout{display:grid;grid-template-columns:360px 1fr;min-height:0;flex:1}
.left{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.search{margin:10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px;color:var(--text)}
.tabs{display:flex;gap:4px;padding:0 10px 10px;overflow:auto}.tab{white-space:nowrap;border:1px solid var(--border);background:var(--surface2);color:var(--muted);padding:5px 9px;border-radius:999px;font-size:10px;cursor:pointer}.tab.active{color:var(--gold);border-color:rgba(242,201,76,.45)}
.list{overflow:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:8px}.card{border:1px solid var(--border);background:var(--surface2);border-radius:8px;padding:10px;cursor:pointer}.card.active{border-color:rgba(79,142,247,.45)}
.title{font-weight:700}.purpose{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{display:inline-block;margin:4px 4px 0 0;font-size:9px;padding:2px 6px;border:1px solid var(--border);border-radius:999px;color:var(--muted)}.hot{color:var(--gold);border-color:rgba(242,201,76,.4)}
.right{display:flex;flex-direction:column;min-height:0}.detail{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:10px}.content{white-space:pre-wrap;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;min-height:140px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}.modal.open{display:flex}.panel{width:min(560px,95vw);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px}
label{font-size:10px;color:var(--muted);text-transform:uppercase;display:block;margin-top:8px}.inp,textarea,select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px;font:inherit}textarea{min-height:150px;resize:vertical}
.toast{position:fixed;bottom:16px;right:16px;padding:7px 10px;border:1px solid rgba(242,201,76,.4);background:var(--surface);border-radius:6px;color:var(--gold);font:10px monospace;opacity:0;transition:.2s}.toast.show{opacity:1}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
  <div class="brand">POF 2828 · PROMPT PICKER</div>
  <div>
    <span id="status" class="status">LOCAL MODE</span>
    <button class="btn" onclick="openCreate()">+ New</button>
    <button class="btn" onclick="exportJSON()">Export</button>
    <button class="btn" onclick="importJSON()">Import</button>
  </div>
</div>
<div class="layout">
  <section class="left">
    <input id="search" class="search" placeholder="Search name, content, tags">
    <div class="tabs" id="tabs"></div>
    <div class="list" id="list"></div>
  </section>
  <section class="right">
    <div class="detail" id="detail"></div>
  </section>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="panel">
    <h3 id="modalTitle" style="margin:0 0 6px;color:var(--gold)">New Prompt</h3>
    <input type="hidden" id="editId">
    <label>Name</label><input id="fName" class="inp">
    <label>Category</label>
    <select id="fCategory" class="inp">
      <option>Framework</option><option>Research</option><option>Meta</option><option>Custom</option>
    </select>
    <label>Content</label><textarea id="fContent"></textarea>
    <label>Hotkey (AHK)</label><input id="fHotkey" class="inp" placeholder="^+1">
    <label>Tags (comma separated)</label><input id="fTags" class="inp" placeholder="framework, extraction">
    <div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="savePrompt()">Save</button>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const STORE='pof2828_prompts';
const GATEWAY=localStorage.getItem('pof2828_gateway_url')||null;
const BASE_CATS=['All','Framework','Research','Meta','Custom'];
let prompts=JSON.parse(localStorage.getItem(STORE)||'[]');
let activeCat='All';
let selectedId=prompts[0]?.id||null;

function persist(){localStorage.setItem(STORE,JSON.stringify(prompts));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function hk(h=''){return h.replace(/\^/g,'Ctrl+').replace(/!/g,'Alt+').replace(/#/g,'Win+');}
function esc(s=''){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
async function sync(method,path,payload){if(!GATEWAY)return;try{await fetch(`${GATEWAY}/api/${path}`,{method,headers:{'Content-Type':'application/json'},body:payload?JSON.stringify(payload):undefined});}catch(_){}}

document.getElementById('status').textContent=GATEWAY?'GATEWAY ENABLED':'LOCAL MODE';

function categories(){const extra=[...new Set(prompts.map(p=>p.category||'Custom'))];return [...new Set([...BASE_CATS,...extra])];}
function filtered(){const q=document.getElementById('search').value.toLowerCase();return prompts.filter(p=>(activeCat==='All'||(p.category||'Custom')===activeCat)&&(`${p.name} ${p.content} ${(p.tags||[]).join(' ')}`).toLowerCase().includes(q));}
function renderTabs(){document.getElementById('tabs').innerHTML=categories().map(c=>`<button class="tab ${c===activeCat?'active':''}" onclick="activeCat='${c}';render()">${c}</button>`).join('');}
function renderList(){const rows=filtered();if(!rows.length){document.getElementById('list').innerHTML='<div class="card">No prompts found.</div>';return;}if(!rows.some(r=>r.id===selectedId))selectedId=rows[0].id;document.getElementById('list').innerHTML=rows.map(p=>`<div class="card ${p.id===selectedId?'active':''}" onclick="selectedId='${p.id}';renderDetail();renderList()"><div class="title">${esc(p.name)}</div><div class="purpose">${esc((p.content||'').split('\n')[0]||'')}</div><div>${(p.tags||[]).map(t=>`<span class='tag'>${esc(t)}</span>`).join('')} ${p.hotkey?`<span class='tag hot'>${esc(hk(p.hotkey))}</span>`:''}</div></div>`).join('');}
function renderDetail(){const p=prompts.find(x=>x.id===selectedId);const d=document.getElementById('detail');if(!p){d.innerHTML='<p style="color:var(--muted)">Select a prompt.</p>';return;}d.innerHTML=`<h2 style='margin:0'>${esc(p.name)}</h2><div style='color:var(--muted);font-size:11px'>${esc(p.category||'Custom')} • ${esc((p.tags||[]).join(', '))||'no tags'} ${p.hotkey?`• ${esc(hk(p.hotkey))}`:''}</div><div class='content'>${esc(p.content)}</div><div class='actions'><button class='btn copy' onclick="copyPrompt('${p.id}')">Copy</button><button class='btn' onclick="openEdit('${p.id}')">Edit</button><button class='btn' onclick="usePrompt('${p.id}')">Use</button><button class='btn' style='color:var(--red)' onclick="removePrompt('${p.id}')">Delete</button></div>`;}
function render(){renderTabs();renderList();renderDetail();}

async function copyPrompt(id){const p=prompts.find(x=>x.id===id);if(!p)return;await navigator.clipboard.writeText(p.content).catch(()=>{});toast('Copied');}
function usePrompt(id){copyPrompt(id);toast('Prompt copied for use');}
function removePrompt(id){const p=prompts.find(x=>x.id===id);if(!p||!confirm(`Delete "${p.name}"?`))return;prompts=prompts.filter(x=>x.id!==id);persist();sync('DELETE',`prompts/${id}`);render();}
function openCreate(){document.getElementById('modalTitle').textContent='New Prompt';document.getElementById('editId').value='';['fName','fContent','fHotkey','fTags'].forEach(i=>document.getElementById(i).value='');document.getElementById('fCategory').value='Custom';document.getElementById('modal').classList.add('open');}
function openEdit(id){const p=prompts.find(x=>x.id===id);if(!p)return;document.getElementById('modalTitle').textContent='Edit Prompt';document.getElementById('editId').value=p.id;document.getElementById('fName').value=p.name;document.getElementById('fCategory').value=p.category||'Custom';document.getElementById('fContent').value=p.content;document.getElementById('fHotkey').value=p.hotkey||'';document.getElementById('fTags').value=(p.tags||[]).join(', ');document.getElementById('modal').classList.add('open');}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function savePrompt(){const id=document.getElementById('editId').value||`p_${Math.random().toString(36).slice(2,8)}`;const prev=prompts.find(p=>p.id===id)||{};const item={id,name:document.getElementById('fName').value.trim(),category:document.getElementById('fCategory').value||'Custom',content:document.getElementById('fContent').value.trim(),hotkey:document.getElementById('fHotkey').value.trim()||null,tags:document.getElementById('fTags').value.split(',').map(t=>t.trim()).filter(Boolean),created_at:prev.created_at||new Date().toISOString()};if(!item.name||!item.content)return toast('Name and content required');const idx=prompts.findIndex(p=>p.id===id);if(idx>=0){prompts[idx]=item;sync('PUT',`prompts/${id}`,item);}else{prompts.unshift(item);sync('POST','prompts',item);}selectedId=id;persist();closeModal();render();toast('Saved');}
function exportJSON(){const b=new Blob([JSON.stringify(prompts,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`pof2828_prompts_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);}
function importJSON(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data))throw 1;prompts=data;selectedId=prompts[0]?.id||null;persist();render();toast('Imported');}catch{toast('Invalid JSON')}};i.click();}

document.getElementById('search').addEventListener('input',render);
render();
</script>
</body>
</html>
