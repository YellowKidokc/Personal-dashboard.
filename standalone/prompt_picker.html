<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POF 2828 — Prompt Picker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #08080c;
    --pane: #0e0e14;
    --card: #13131b;
    --card-hover: #171721;
    --card-selected: #161625;
    --border: #1c1c28;
    --border-sel: #2d2d48;
    --text: #b8bcc6;
    --text-secondary: #6a6a80;
    --bright: #dde0e8;
    --gold: #e8a912;
    --gold-dim: rgba(232, 169, 18, .12);
    --green: #2ecc8e;
    --green-dim: rgba(46, 204, 142, .10);
    --red: #d44;
    --cyan: #4ac4d4;
    --cyan-dim: rgba(74, 196, 212, .08);
    --purple: #8070c8;
    --purple-dim: rgba(128, 112, 200, .08);
    --font: 'DM Mono', 'Menlo', monospace;
    --fs: 13px;
    --lh: 1.55;
    --radius: 6px;
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #222230; border-radius: 3px; }

  body {
    font-family: var(--font);
    font-size: var(--fs);
    line-height: var(--lh);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ───────── TOPBAR ───────── */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--pane);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-shrink: 0;
  }
  .brand-name { font-weight: 500; color: var(--gold); letter-spacing: 2px; }
  .brand-label { color: var(--text-secondary); letter-spacing: 1px; }
  .topbar-sep { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }
  .search-wrap { flex: 1; position: relative; max-width: 360px; }
  .search-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 7px 12px 7px 30px;
    color: var(--text);
    font: inherit;
    outline: none;
    transition: border-color .15s;
  }
  .search-input:focus { border-color: var(--gold); }
  .search-input::placeholder { color: #2e2e3e; }
  .search-icon {
    position: absolute; left: 10px; top: 50%;
    transform: translateY(-50%); color: #2e2e3e; pointer-events: none;
  }
  .topbar-actions { display: flex; gap: 6px; margin-left: auto; flex-shrink: 0; }
  .top-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--text-secondary); padding: 6px 12px;
    border-radius: var(--radius); font: inherit; cursor: pointer;
    transition: all .12s; white-space: nowrap;
  }
  .top-btn:hover { border-color: var(--gold); color: var(--gold); }
  .top-btn.primary {
    background: var(--gold); color: #000;
    border-color: var(--gold); font-weight: 500;
  }
  .top-btn.primary:hover { filter: brightness(1.1); }

  /* ───────── FILTER TABS ───────── */
  .filter-bar {
    display: flex; align-items: center; gap: 2px;
    padding: 6px 16px; background: var(--pane);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    overflow-x: auto;
  }
  .filter-tab {
    padding: 5px 12px; background: none; border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-secondary); font: inherit; cursor: pointer;
    transition: all .1s; white-space: nowrap;
  }
  .filter-tab:hover { color: var(--text); }
  .filter-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
  .filter-count { margin-left: auto; color: var(--text-secondary); }

  /* ───────── TWO-PANE BODY ───────── */
  .body-wrap { flex: 1; display: flex; overflow: hidden; }

  /* LEFT: PROMPT LIST */
  .list-pane {
    width: 420px; min-width: 320px; max-width: 50%;
    border-right: 1px solid var(--border);
    overflow-y: auto; padding: 10px;
    display: flex; flex-direction: column; gap: 8px;
    background: var(--bg);
  }

  .card {
    padding: 14px 16px; background: var(--card);
    border: 1px solid var(--border); border-radius: var(--radius);
    cursor: pointer; transition: all .1s;
  }
  .card:hover { background: var(--card-hover); border-color: var(--border-sel); }
  .card.selected {
    background: var(--card-selected);
    border-color: var(--border-sel);
    box-shadow: inset 3px 0 0 var(--gold);
  }
  .card-title {
    font-weight: 500; color: var(--bright);
    margin-bottom: 3px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .card-purpose {
    color: var(--text-secondary); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
    margin-bottom: 8px;
  }
  .card-bottom { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tag {
    padding: 2px 8px; background: var(--cyan-dim); color: var(--cyan);
    border: 1px solid rgba(74, 196, 212, .15); border-radius: 3px;
    letter-spacing: .5px; text-transform: uppercase; font-size: 11px;
  }
  .hotkey-badge {
    padding: 2px 8px; background: var(--gold-dim); color: var(--gold);
    border-radius: 3px; font-size: 11px;
  }
  .cat-badge {
    padding: 2px 8px; background: var(--purple-dim); color: var(--purple);
    border-radius: 3px; font-size: 11px;
  }
  .card-time { margin-left: auto; color: #2e2e3e; }
  .card-actions { display: flex; gap: 4px; margin-top: 10px; }
  .card-btn {
    padding: 5px 14px; background: transparent;
    border: 1px solid var(--border); border-radius: 4px;
    color: var(--text-secondary); font: inherit; cursor: pointer;
    transition: all .1s;
  }
  .card-btn:hover { border-color: #3a3a50; color: var(--text); }
  .card-btn:active { transform: scale(.96); }
  .card-btn.copy-btn {
    background: var(--green-dim);
    border-color: rgba(46, 204, 142, .25);
    color: var(--green); font-weight: 500; flex: 1;
  }
  .card-btn.copy-btn:hover { background: rgba(46, 204, 142, .18); }

  /* RIGHT: DETAIL VIEW */
  .detail-pane {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; background: var(--pane);
  }
  .detail-empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #222230; text-align: center; padding: 40px; gap: 8px;
  }
  .detail-empty .sub { color: #1a1a28; }

  .detail-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); }
  .detail-title {
    font-weight: 500; color: var(--bright);
    margin-bottom: 8px; word-break: break-word;
  }
  .detail-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  .detail-actions {
    display: flex; gap: 6px; padding: 14px 24px;
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .det-btn {
    padding: 8px 18px; background: transparent;
    border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text-secondary); font: inherit; cursor: pointer;
    transition: all .1s;
  }
  .det-btn:hover { border-color: #3a3a50; color: var(--text); }
  .det-btn:active { transform: scale(.97); }
  .det-btn.copy-main {
    background: var(--green); border-color: var(--green);
    color: #000; font-weight: 500;
  }
  .det-btn.copy-main:hover { filter: brightness(1.1); }
  .det-btn.danger { color: var(--red); border-color: rgba(221, 68, 68, .25); }
  .det-btn.danger:hover { background: rgba(221, 68, 68, .08); }

  .detail-content {
    flex: 1; padding: 20px 24px; white-space: pre-wrap;
    word-break: break-word; color: var(--text);
    background: var(--bg); margin: 16px 24px;
    border: 1px solid var(--border); border-radius: var(--radius);
    overflow-y: auto; min-height: 120px;
  }

  .list-empty { text-align: center; padding: 40px 16px; color: #2e2e3e; }

  /* ───────── MODAL ───────── */
  .modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(0, 0, 0, .72); z-index: 100;
    align-items: center; justify-content: center; padding: 16px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 22px; width: 100%;
    max-width: 500px; max-height: 85vh; overflow-y: auto;
  }
  .modal h2 {
    font-weight: 500; color: var(--gold);
    letter-spacing: 2px; margin-bottom: 16px;
  }
  .modal label {
    display: block; color: var(--text-secondary);
    letter-spacing: 1px; text-transform: uppercase;
    margin: 12px 0 4px; font-size: 11px;
  }
  .modal input, .modal textarea {
    width: 100%; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 9px 12px; color: var(--text);
    font: inherit; outline: none; transition: border-color .15s;
  }
  .modal textarea { min-height: 140px; resize: vertical; }
  .modal input:focus, .modal textarea:focus { border-color: var(--gold); }
  .modal-row {
    display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end;
  }
  .mbtn {
    padding: 9px 20px; border-radius: var(--radius);
    font: inherit; font-weight: 500; cursor: pointer;
    border: 1px solid var(--border); transition: all .1s;
  }
  .mbtn.save { background: var(--green); color: #000; border-color: var(--green); }
  .mbtn.save:hover { filter: brightness(1.1); }
  .mbtn.cancel { background: transparent; color: var(--text-secondary); }
  .mbtn.cancel:hover { border-color: #3a3a50; }

  /* ───────── TOAST ───────── */
  .toast {
    position: fixed; bottom: 18px; left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: var(--gold); color: #000;
    padding: 7px 22px; border-radius: 5px;
    font-weight: 500; letter-spacing: 1.5px;
    z-index: 200; transition: transform .18s ease; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ───────── MOBILE ───────── */
  @media (max-width: 720px) {
    .list-pane { width: 100%; max-width: 100%; border-right: none; }
    .detail-pane { display: none; }
    .body-wrap.detail-open .list-pane { display: none; }
    .body-wrap.detail-open .detail-pane { display: flex; }
    .back-btn { display: inline-block !important; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="brand-name">POF 2828</span>
    <span class="brand-label">Prompt Picker</span>
  </div>
  <div class="topbar-sep"></div>
  <div class="search-wrap">
    <span class="search-icon">&#x2315;</span>
    <input class="search-input" id="searchInput" placeholder="Search prompts..." autocomplete="off">
  </div>
  <div class="topbar-actions">
    <button class="top-btn" onclick="exportData()">Export</button>
    <button class="top-btn" onclick="document.getElementById('fileInput').click()">Import</button>
    <button class="top-btn primary" onclick="openAdd()">+ New</button>
  </div>
</div>

<div class="filter-bar" id="filterBar">
  <button class="filter-tab active" data-f="all" onclick="setFilter('all')">All</button>
  <span class="filter-count" id="filterCount"></span>
</div>

<div class="body-wrap" id="bodyWrap">
  <div class="list-pane" id="listPane"></div>
  <div class="detail-pane" id="detailPane">
    <div class="detail-empty">Select a prompt<span class="sub">Click any card to preview &middot; Double-click to copy</span></div>
  </div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="modalTitle">NEW PROMPT</h2>
    <input type="hidden" id="editId">
    <label>Name</label>
    <input id="fName" placeholder="e.g. Steelman Objection">
    <label>Category</label>
    <input id="fCategory" placeholder="e.g. Framework, Research, General">
    <label>Content</label>
    <textarea id="fContent" placeholder="The prompt content..."></textarea>
    <label>Hotkey (e.g. Ctrl+Shift+1)</label>
    <input id="fHotkey" placeholder="Leave blank for no hotkey">
    <label>Tags (comma separated)</label>
    <input id="fTags" placeholder="e.g. framework, research">
    <div class="modal-row">
      <button class="mbtn cancel" onclick="closeModal()">Cancel</button>
      <button class="mbtn save" onclick="savePrompt()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
const STORE='pof2828_prompts';
let prompts=[], filter='all', search='', selIdx=-1;

function load(){ try { prompts=JSON.parse(localStorage.getItem(STORE))||[]; } catch { prompts=[]; } }
function save(){ localStorage.setItem(STORE, JSON.stringify(prompts)); }
function gid(){ return 'p_'+Math.random().toString(36).slice(2,8); }

function getCategories(){
  const cats=new Set();
  prompts.forEach(p=>{ if(p.category) cats.add(p.category); });
  return ['all', ...cats];
}

function renderAll(){ renderFilterBar(); renderList(); renderDetail(); renderCount(); }

function renderFilterBar(){
  const bar=document.getElementById('filterBar');
  const cats=getCategories();
  bar.innerHTML=cats.map(c=>{
    const active=c===filter?' active':'';
    return `<button class="filter-tab${active}" data-f="${esc(c)}" onclick="setFilter('${esc(c)}')">${esc(c==='all'?'All':c)}</button>`;
  }).join('')+`<span class="filter-count" id="filterCount"></span>`;
}

function getFiltered(){
  let f=prompts;
  if(filter!=='all') f=f.filter(p=>(p.category||'Custom').toLowerCase()===filter.toLowerCase());
  if(search){ const q=search.toLowerCase(); f=f.filter(p=>
    (p.name||'').toLowerCase().includes(q)||
    (p.content||'').toLowerCase().includes(q)||
    (p.tags||[]).some(t=>t.toLowerCase().includes(q))
  ); }
  return f;
}

function renderList(){
  const pane=document.getElementById('listPane'), f=getFiltered();
  if(!f.length){ pane.innerHTML=`<div class="list-empty">${search?'No matches':'No prompts yet — click + New'}</div>`; return; }
  pane.innerHTML=f.map(p=>{
    const idx=prompts.indexOf(p);
    const sel=idx===selIdx?' selected':'';
    const hotkeyStr=p.hotkey?formatHotkey(p.hotkey):'';
    return `<div class="card${sel}" onclick="selectPrompt(${idx})" ondblclick="copyIdx(${idx})">
      <div class="card-title">${esc(p.name||'Untitled')}</div>
      <div class="card-purpose">${esc((p.content||'').substring(0,90))}</div>
      <div class="card-bottom">
        ${p.category?`<span class="cat-badge">${esc(p.category)}</span>`:''}
        ${hotkeyStr?`<span class="hotkey-badge">${esc(hotkeyStr)}</span>`:''}
        ${(p.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
        <span class="card-time">${timeAgo(p.created_at)}</span>
      </div>
      <div class="card-actions">
        <button class="card-btn copy-btn" onclick="event.stopPropagation();copyIdx(${idx})">Copy</button>
        <button class="card-btn" onclick="event.stopPropagation();openEdit(${idx})">Edit</button>
      </div>
    </div>`;
  }).join('');
}

function renderDetail(){
  const pane=document.getElementById('detailPane');
  if(selIdx<0||selIdx>=prompts.length){
    pane.innerHTML=`<div class="detail-empty">Select a prompt<span class="sub">Click to preview &middot; Double-click to copy</span></div>`;
    return;
  }
  const p=prompts[selIdx];
  const hotkeyStr=p.hotkey?formatHotkey(p.hotkey):'';
  pane.innerHTML=`
    <div class="detail-header">
      <button class="det-btn back-btn" style="display:none;margin-bottom:10px" onclick="closeMobileDetail()">&larr; Back</button>
      <div class="detail-title">${esc(p.name||'Untitled')}</div>
      <div class="detail-meta">
        ${p.category?`<span class="cat-badge">${esc(p.category)}</span>`:''}
        ${hotkeyStr?`<span class="hotkey-badge">${esc(hotkeyStr)}</span>`:''}
        ${(p.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
        <span class="card-time">${timeAgo(p.created_at)}</span>
      </div>
    </div>
    <div class="detail-actions">
      <button class="det-btn copy-main" onclick="copyIdx(${selIdx})">Copy to Clipboard</button>
      <button class="det-btn" onclick="openEdit(${selIdx})">Edit</button>
      <button class="det-btn danger" onclick="deletePrompt(${selIdx})">Delete</button>
    </div>
    <div class="detail-content">${esc(p.content)}</div>`;
}

function renderCount(){
  const el=document.getElementById('filterCount');
  if(el) el.textContent=getFiltered().length+' prompts';
}

// ── ACTIONS ──
function selectPrompt(idx){
  selIdx=idx; renderList(); renderDetail();
  if(window.innerWidth<=720) document.getElementById('bodyWrap').classList.add('detail-open');
}
function closeMobileDetail(){ document.getElementById('bodyWrap').classList.remove('detail-open'); }

function copyIdx(idx){
  if(idx>=0&&idx<prompts.length) copyText(prompts[idx].content);
}
function copyText(t){
  if(!t) return;
  navigator.clipboard.writeText(t).then(()=>toast('Copied')).catch(()=>{
    const a=document.createElement('textarea'); a.value=t;
    document.body.appendChild(a); a.select();
    document.execCommand('copy'); document.body.removeChild(a); toast('Copied');
  });
}

function deletePrompt(idx){
  if(!confirm('Delete this prompt?')) return;
  prompts.splice(idx,1);
  if(selIdx>=prompts.length) selIdx=prompts.length-1;
  save(); renderAll(); toast('Deleted');
}

function setFilter(f){ filter=f; renderAll(); }

// ── MODAL ──
function openAdd(){
  document.getElementById('modalTitle').textContent='NEW PROMPT';
  document.getElementById('editId').value='';
  document.getElementById('fName').value='';
  document.getElementById('fCategory').value='';
  document.getElementById('fContent').value='';
  document.getElementById('fHotkey').value='';
  document.getElementById('fTags').value='';
  document.getElementById('modalBg').classList.add('open');
  setTimeout(()=>document.getElementById('fName').focus(),80);
}
function openEdit(idx){
  const p=prompts[idx];
  document.getElementById('modalTitle').textContent='EDIT PROMPT';
  document.getElementById('editId').value=idx;
  document.getElementById('fName').value=p.name||'';
  document.getElementById('fCategory').value=p.category||'';
  document.getElementById('fContent').value=p.content||'';
  document.getElementById('fHotkey').value=p.hotkey||'';
  document.getElementById('fTags').value=(p.tags||[]).join(', ');
  document.getElementById('modalBg').classList.add('open');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }

function savePrompt(){
  const eidx=document.getElementById('editId').value;
  const name=document.getElementById('fName').value.trim();
  const content=document.getElementById('fContent').value.trim();
  if(!name||!content){ toast('Name and content required'); return; }
  const category=document.getElementById('fCategory').value.trim()||'Custom';
  const hotkey=document.getElementById('fHotkey').value.trim()||null;
  const tags=document.getElementById('fTags').value.split(',').map(t=>t.trim()).filter(Boolean);
  if(eidx!==''){
    const i=parseInt(eidx);
    prompts[i].name=name; prompts[i].category=category;
    prompts[i].content=content; prompts[i].hotkey=hotkey;
    prompts[i].tags=tags; selIdx=i;
  } else {
    prompts.unshift({ id:gid(), name, category, content, hotkey, tags, created_at:new Date().toISOString() });
    selIdx=0;
  }
  save(); closeModal(); renderAll(); toast(eidx!==''?'Updated':'Added');
}

// ── IMPORT/EXPORT ──
function exportData(){
  const b=new Blob([JSON.stringify(prompts,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download=`pof2828_prompts_${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href); toast('Exported');
}
function handleImport(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader(); r.onload=function(ev){
    try {
      const d=JSON.parse(ev.target.result);
      if(Array.isArray(d)){ prompts=d; }
      else throw 0;
      save(); renderAll(); toast('Imported');
    } catch { toast('Invalid file'); }
  }; r.readAsText(file); e.target.value='';
}

// ── KEYBOARD ──
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal();
  if(e.ctrlKey&&e.shiftKey&&e.key==='N'){ e.preventDefault(); openAdd(); }
  if((e.key==='ArrowDown'||e.key==='ArrowUp')&&document.activeElement.tagName!=='TEXTAREA'&&document.activeElement.tagName!=='INPUT'){
    const f=getFiltered(); if(!f.length) return; e.preventDefault();
    const cur=f.indexOf(prompts[selIdx]);
    const nxt=e.key==='ArrowDown'?(cur<f.length-1?cur+1:0):(cur>0?cur-1:f.length-1);
    selIdx=prompts.indexOf(f[nxt]); renderList(); renderDetail();
    const s=document.querySelector('.card.selected'); if(s) s.scrollIntoView({block:'nearest'});
  }
  if(e.key==='Enter'&&!document.getElementById('modalBg').classList.contains('open')&&
    document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){
    if(selIdx>=0&&selIdx<prompts.length) copyIdx(selIdx);
  }
});

document.getElementById('searchInput').addEventListener('input',e=>{ search=e.target.value; renderAll(); });

// ── HELPERS ──
function esc(s){ if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function formatHotkey(hk){ return (hk||'').replace(/\^/g,'Ctrl+').replace(/!/g,'Alt+').replace(/#/g,'Win+'); }
function timeAgo(iso){ if(!iso) return '';
  const s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<60) return 'now'; if(s<3600) return Math.floor(s/60)+'m';
  if(s<86400) return Math.floor(s/3600)+'h'; if(s<2592000) return Math.floor(s/86400)+'d';
  return Math.floor(s/2592000)+'mo';
}
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1400); }
