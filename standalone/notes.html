<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POF 2828 — Notes</title>
<style>
:root{--bg:#0B0C0F;--surface:#11131A;--surface2:#181B26;--border:rgba(244,246,255,.08);--text:#F4F6FF;--muted:#8A8F9E;--gold:#F2C94C;--green:#4ECB71;--blue:#4F8EF7;--purple:#9B7FE8;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:13px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column}
.header{padding:12px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font:700 11px 'IBM Plex Mono',monospace;letter-spacing:.18em;color:var(--gold)}
.actions{display:flex;gap:6px;flex-wrap:wrap}.btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:11px}.btn.primary{background:var(--gold);color:#111;border-color:var(--gold)}
.main{display:grid;grid-template-columns:280px 1fr;flex:1;min-height:0}
.sidebar{border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.search{margin:10px;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text)}
.list{overflow:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:8px}
.card{border:1px solid var(--border);background:var(--surface2);border-radius:8px;padding:8px;cursor:pointer}.card.active{border-color:var(--gold)}.meta{font-size:10px;color:var(--muted)}
.editor{display:flex;flex-direction:column;min-height:0}.row{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--border)}
.inp,textarea{background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px;font:inherit} textarea{flex:1;resize:none}
.preview{display:none;overflow:auto;padding:12px}.preview.on{display:block}.editor-body{display:flex;flex:1;min-height:0}.editor-body textarea.off{display:none}
.toast{position:fixed;bottom:16px;right:16px;background:var(--surface);border:1px solid var(--gold);padding:8px 10px;border-radius:6px;font:11px monospace;color:var(--gold);opacity:0;transition:.2s}.toast.show{opacity:1}
@media (max-width:900px){.main{grid-template-columns:1fr}.sidebar{max-height:40vh}}
</style>
</head>
<body>
<div class="header">
  <div class="brand">POF 2828 · NOTES</div>
  <div class="actions">
    <button class="btn" onclick="createNote()">+ New</button>
    <button class="btn" onclick="sendToClipboard()">Send to Clipboard</button>
    <button class="btn" onclick="exportMarkdown()">Export .md</button>
    <button class="btn" onclick="exportJSON()">Export JSON</button>
    <button class="btn" onclick="importJSON()">Import JSON</button>
  </div>
</div>
<div class="main">
  <aside class="sidebar">
    <input class="search" id="search" placeholder="Search notes/tags..." oninput="renderList()">
    <div class="list" id="list"></div>
  </aside>
  <section class="editor">
    <div class="row">
      <input id="title" class="inp" style="flex:1" placeholder="Title (auto from first line)">
      <input id="tags" class="inp" style="width:220px" placeholder="tags, comma">
      <button class="btn" onclick="togglePin()">Pin</button>
      <button class="btn primary" onclick="togglePreview()">Preview</button>
    </div>
    <div class="editor-body">
      <textarea id="content" placeholder="Write markdown notes..."></textarea>
      <div id="preview" class="preview"></div>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script>
const STORE='pof2828_notes';
let notes=JSON.parse(localStorage.getItem(STORE)||'[]');
let selectedId=notes[0]?.id||null; let timer;
const byId=id=>document.getElementById(id);
function persist(){localStorage.setItem(STORE,JSON.stringify(notes));}
function toast(m){const t=byId('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function createNote(){const now=new Date().toISOString();const n={id:`n_${Math.random().toString(36).slice(2,8)}`,title:'Untitled note',content:'',tags:[],pinned:false,created_at:now,updated_at:now};notes.unshift(n);selectedId=n.id;persist();renderList();loadSelected();}
function renderList(){const q=byId('search').value.toLowerCase();const list=[...notes].sort((a,b)=>(b.pinned-a.pinned)||b.updated_at.localeCompare(a.updated_at)).filter(n=>`${n.title} ${n.content} ${(n.tags||[]).join(' ')}`.toLowerCase().includes(q));byId('list').innerHTML=list.map(n=>`<div class="card ${n.id===selectedId?'active':''}" onclick="selectNote('${n.id}')"><div>${n.pinned?'📌 ':''}${esc(n.title)}</div><div class="meta">${(n.tags||[]).join(' · ')||'no tags'} · ${new Date(n.updated_at).toLocaleString()}</div></div>`).join('');}
function selectNote(id){selectedId=id;renderList();loadSelected();}
function current(){return notes.find(n=>n.id===selectedId);} 
function loadSelected(){if(!selectedId&&!notes.length)createNote();const n=current();if(!n)return;byId('title').value=n.title;byId('tags').value=(n.tags||[]).join(', ');byId('content').value=n.content;renderPreview();}
function saveCurrent(){const n=current();if(!n)return;const content=byId('content').value;const first=content.split('\n').find(Boolean)||'Untitled note';n.title=byId('title').value.trim()||first.slice(0,80);n.content=content;n.tags=byId('tags').value.split(',').map(t=>t.trim()).filter(Boolean);n.updated_at=new Date().toISOString();persist();renderList();renderPreview();}
function debounceSave(){clearTimeout(timer);timer=setTimeout(saveCurrent,500);}
function togglePin(){const n=current();if(!n)return;n.pinned=!n.pinned;saveCurrent();}
function markdown(md){return esc(md).replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>');}
function renderPreview(){byId('preview').innerHTML=markdown(byId('content').value||'');}
function togglePreview(){byId('preview').classList.toggle('on');byId('content').classList.toggle('off');renderPreview();}
async function sendToClipboard(){const n=current();if(!n)return;await navigator.clipboard.writeText(n.content).catch(()=>{});const clips=JSON.parse(localStorage.getItem('pof2828_clips')||'[]');clips.unshift({id:`c_${Date.now()}`,content:n.content,title:n.title,tags:['note'],created_at:new Date().toISOString()});localStorage.setItem('pof2828_clips',JSON.stringify(clips));toast('Sent to clipboard');}
function exportJSON(){const b=new Blob([JSON.stringify(notes,null,2)],{type:'application/json'});dl(b,`pof2828_notes_${new Date().toISOString().slice(0,10)}.json`);}
function exportMarkdown(){const n=current();if(!n)return;dl(new Blob([n.content],{type:'text/markdown'}),`${n.title.replace(/\W+/g,'_')||'note'}.md`);}
function importJSON(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{notes=JSON.parse(await f.text());selectedId=notes[0]?.id||null;persist();renderList();loadSelected();toast('Imported');}catch{toast('Invalid JSON')}};i.click();}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);toast('Exported');}
function esc(s=''){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
['title','tags','content'].forEach(id=>byId(id).addEventListener('input',debounceSave));
renderList(); if(!notes.length) createNote(); else loadSelected();
</script>
</body>
</html>
